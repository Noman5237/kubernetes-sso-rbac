events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8443 ssl;
    server_name sso.lab.test;
    ssl_certificate /tls/sso.crt;
    ssl_certificate_key /tls/sso.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /__lab_tls_probe { default_type text/plain; return 200 'sso TLS OK\n'; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
      set $keycloak_upstream https://sso-lab-keycloak:8443;
      proxy_pass $keycloak_upstream;
      proxy_ssl_server_name on;
      proxy_ssl_name sso.lab.test;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /tls/ca.crt;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
  server {
    listen 8443 ssl;
    server_name rancher.lab.test;
    ssl_certificate /tls/rancher.crt;
    ssl_certificate_key /tls/rancher.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /__lab_tls_probe { default_type text/plain; return 200 'rancher TLS OK\n'; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
      set $rancher_upstream http://mngmt-control-plane:30080;
      proxy_pass $rancher_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 30s;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_buffering off;
    }
  }
}
