name: kubernetes-sso-lab
services:
  gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    container_name: sso-lab-gateway
    restart: unless-stopped
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./config/network/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls:/tls:ro
    networks:
      kind:
        aliases:
          - sso.lab.test
          - rancher.lab.test
networks:
  kind:
    external: true
